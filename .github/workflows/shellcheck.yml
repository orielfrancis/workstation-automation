name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run ShellCheck in the dev container
        uses: devcontainers/ci@v0.3.1900000450
        with:
          push: never
          runCmd: |
            shellcheck --version
            shellcheck -S warning bluefin/scripts/*.sh
