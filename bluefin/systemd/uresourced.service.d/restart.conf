# Drop-in for Fedora's uresourced USER service (/usr/lib/systemd/user/uresourced.service).
# uresourced 0.5.4 (Fedora 44) sometimes segfaults while reading a PipeWire node
# (node_event_info -> strtoll). The stock unit has no Restart=, so one crash
# leaves it stopped until the next login. Restart it automatically instead.
[Service]
Restart=on-failure
RestartSec=10
